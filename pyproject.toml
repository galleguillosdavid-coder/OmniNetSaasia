[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omninet-pro"
version = "2.9.6"
description = "Autonomous Cross-Platform Network Optimizer, Auto-Healing Triage & Persistent Telemetry Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Commercial / Proprietary" }
authors = [
    { name = "OmniNet Technologies", email = "contact@omninet.ai" }
]
keywords = [
    "network-optimization",
    "autonomous-agent",
    "tcp-tuning",
    "dns-benchmark",
    "latency-reduction",
    "bufferbloat-mitigation",
    "self-healing-network",
    "mcp-server",
    "cross-platform"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: System :: Networking",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

[project.scripts]
omninet = "main:main"
omninet-agent = "main:main"
omninet-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
include = ["netopt*", "netopt.*", "hermes*", "hermes.*", "cloud_server*"]

